[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Rootless-Docker and gVisor-backed runtime for a single profiled sandbox container."
keywords = ["docker", "gvisor", "omp", "rootless", "sandbox"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.1.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
agent-sandbox = "agent_sandbox.cli:main"

[project.optional-dependencies]
factory = [
    "dbos>=3.3.0",
    "fastapi>=0.156.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "uvicorn>=0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]


[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py312"
respect-gitignore = true
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "C4"]
ignore = [
  "RUF100",
  "E402",
  "B904"
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
section-order = ["standard-library", "third-party", "first-party", "local-folder"]

# Use Ruff's Black-compatible formatter.
[tool.ruff.format]

[dependency-groups]
dev = [
    "agent-sandbox[factory]",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv.sources]
agent-sandbox = { workspace = true }
