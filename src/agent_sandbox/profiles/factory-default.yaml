name: factory-default
image: agent-sandbox:trixie
workdir: /workspace
mounts:
  # The mise shim is unavailable inside the sandbox image, so mount the Pi install (binary plus sibling assets).
  - source: /home/noob/.local/share/mise/installs/pi/latest/pi
    target: /opt/pi
    mode: ro
  - source: /home/noob/.agents/AGENTS.md
    target: /workspace/AGENTS.md
    mode: ro
pi_binary: /opt/pi/pi
host_services:
  # pi-host's model gateway; development holds 8300, production units set PI_GATEWAY_PORT.
  PI_GATEWAY_URL: "${PI_GATEWAY_PORT:-8300}"
