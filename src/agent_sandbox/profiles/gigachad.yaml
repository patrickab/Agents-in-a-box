name: gigachad
image: agent-sandbox:trixie
workdir: /workspace
mounts:
  # The mise shim is unavailable inside the sandbox image, so mount the Pi install (binary plus sibling assets).
  - source: ${HOME}/.local/share/mise/installs/pi/latest/pi
    target: /opt/pi
    mode: ro
  - source: ${HOME}/git/gigachad-bot/.venv
    target: ${HOME}/git/gigachad-bot/.venv
    mode: ro
  - source: ${HOME}/.local/share/uv/python/cpython-3.12-linux-x86_64-gnu
    target: ${HOME}/.local/share/uv/python/cpython-3.12-linux-x86_64-gnu
    mode: ro
  - source: ${HOME}/.agents/AGENTS.md
    target: /workspace/AGENTS.md
    mode: ro
pi_binary: /opt/pi/pi
python_interpreters:
  venv: ${HOME}/git/gigachad-bot/.venv/bin/python3
  uv-base: ${HOME}/.local/share/uv/python/cpython-3.12-linux-x86_64-gnu/bin/python3
host_services:
  # pi-host's model gateway; development holds 8300, production units set PI_GATEWAY_PORT.
  PI_GATEWAY_URL: "${PI_GATEWAY_PORT:-8300}"
