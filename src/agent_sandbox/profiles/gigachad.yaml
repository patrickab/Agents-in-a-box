name: gigachad
image: agent-sandbox:trixie
workdir: /workspace
mounts:
  # The host wrapper invokes mise, unavailable inside the sandbox image.
  - source: /home/noob/.local/share/mise/installs/github-can1357-oh-my-pi/latest/omp
    target: /usr/local/bin/omp
    mode: ro
  - source: /home/noob/git/gigachad-bot/.venv
    target: /home/noob/git/gigachad-bot/.venv
    mode: ro
  - source: /home/noob/.local/share/uv/python/cpython-3.12-linux-x86_64-gnu
    target: /home/noob/.local/share/uv/python/cpython-3.12-linux-x86_64-gnu
    mode: ro
  - source: /home/noob/.omp
    target: /root/.omp
    mode: ro
  - source: /home/noob/.agents/AGENTS.md
    target: /workspace/AGENTS.md
    mode: ro
workspace:
  mode: managed
omp_binary: /usr/local/bin/omp
python_interpreters:
  venv: /home/noob/git/gigachad-bot/.venv/bin/python3
  uv-base: /home/noob/.local/share/uv/python/cpython-3.12-linux-x86_64-gnu/bin/python3
env_passthrough:
  - OPENAI_API_KEY
  - OPENROUTER_API_KEY
  - GEMINI_API_KEY
  - DEEPSEEK_API_KEY
  - TAVILY_API_KEY
  - BRAVE_API_KEY
  - NVIDIA_NIM_API_KEY
  - OLLAMA_API_KEY
host_services:
  # Reach the host Ollama daemon on its default port so ollama/* models resolve.
  OLLAMA_HOST: 11434
